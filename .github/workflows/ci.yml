name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - run: sudo apt-get update && sudo apt-get install -y nasm clang pkg-config libssl-dev
      - run: bash scripts/install-cargo-near.sh
      - run: bash scripts/judge.sh
      - run: pnpm check
      - run: pnpm run build:web
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
